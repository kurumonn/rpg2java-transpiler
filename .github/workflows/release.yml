name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: rpg2java-transpiler-linux-x64.tar.gz
            binary: rpg2java-transpiler
          - os: windows-latest
            archive: rpg2java-transpiler-windows-x64.zip
            binary: rpg2java-transpiler.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Quality gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --tests

      - name: Build release binary
        run: cargo build --release

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/rpg2java-transpiler
          cp target/release/${{ matrix.binary }} dist/rpg2java-transpiler/
          cp README.md DESIGN.md dist/rpg2java-transpiler/
          cp -r docs examples dist/rpg2java-transpiler/
          tar -czf dist/${{ matrix.archive }} -C dist rpg2java-transpiler

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\rpg2java-transpiler | Out-Null
          Copy-Item target\release\${{ matrix.binary }} dist\rpg2java-transpiler\
          Copy-Item README.md,DESIGN.md dist\rpg2java-transpiler\
          Copy-Item docs,examples dist\rpg2java-transpiler\ -Recurse
          Compress-Archive -Path dist\rpg2java-transpiler -DestinationPath dist\${{ matrix.archive }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rpg2java-transpiler:${{ github.ref_name }} .

      - name: Run doctor
        run: docker run --rm rpg2java-transpiler:${{ github.ref_name }} doctor

  publish:
    name: publish-github-release
    runs-on: ubuntu-latest
    needs:
      - package
      - docker-smoke
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: dist/*
