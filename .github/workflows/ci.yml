name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --tests

  javac-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["21", "25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Compile-check generated Java
        run: |
          mkdir -p out/ci
          if [ "${{ matrix.java-version }}" = "25" ]; then
            TARGET="java25-stable"
          else
            TARGET="java21"
          fi
          cargo run -- \
            --input ./examples/sample.rpg \
            --output ./out/ci/LegacyOrderMain.java \
            --class-name LegacyOrderMain \
            --java-target "$TARGET" \
            --report-json ./out/ci/report.json \
            --report-md ./out/ci/report.md \
            --javac-check \
            --javac-cmd javac
